<header
    class="hidden md:flex w-20 lg:w-[260px] flex-col justify-between sticky top-0 h-screen py-6 shrink-0 text-zinc-900 dark:text-zinc-100">

    <div class="flex flex-col gap-6">

        <!-- Logo -->
        <a href="#" class="flex items-center gap-3.5 px-2 lg:px-3 text-zinc-900 dark:text-white group">

            <div
                class="w-11 h-11 bg-gradient-to-tr from-violet-600 via-indigo-500 to-pink-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition-all duration-300">

                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />

                </svg>

            </div>

            <span
                class="hidden lg:block text-2xl font-black tracking-wider bg-gradient-to-r from-zinc-900 via-zinc-700 to-zinc-500 dark:from-white dark:via-zinc-200 dark:to-zinc-400 bg-clip-text text-transparent">

                NEXUS

            </span>

        </a>


        <!-- Main Navigation -->
        <nav class="flex flex-col gap-2 mt-2">

            <!-- Feed -->
            <a routerLink="/feed" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center gap-4 px-4 py-3.5 rounded-2xl bg-zinc-100 dark:bg-white/5 border border-zinc-200 dark:border-white/10 text-zinc-900 dark:text-white w-fit lg:w-full group shadow-lg backdrop-blur-md">

                <svg class="w-6 h-6 text-violet-500 dark:text-violet-400" fill="currentColor" viewBox="0 0 24 24">

                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />

                </svg>

                <span class="hidden lg:block text-[16px] font-bold">
                    Feed
                </span>

            </a>
            <!-- My Posts -->
            <a routerLink="/my-posts" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center gap-4 px-4 py-3.5 rounded-2xl bg-zinc-100 dark:bg-white/5 border border-zinc-200 dark:border-white/10 text-zinc-900 dark:text-white w-fit lg:w-full group shadow-lg backdrop-blur-md">

                <svg class="w-6 h-6 text-zinc-600 dark:text-zinc-400 group-hover:text-violet-500 dark:group-hover:text-violet-400 transition-colors"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v12a2 2 0 01-2 2zM7 8h10M7 12h6M7 16h4" />

                </svg>

                <span class="hidden lg:block text-[16px] font-medium">
                    My Posts
                </span>

            </a>


            <!-- Community -->
            <a routerLink="/community" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center gap-4 px-4 py-3.5 rounded-2xl bg-zinc-100 dark:bg-white/5 border border-zinc-200 dark:border-white/10 text-zinc-900 dark:text-white w-fit lg:w-full group shadow-lg backdrop-blur-md">

                <svg class="w-6 h-6 text-zinc-600 dark:text-zinc-400 group-hover:text-violet-500 dark:group-hover:text-violet-400 transition-colors"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />

                </svg>

                <span class="hidden lg:block text-[16px] font-medium">
                    Community
                </span>

            </a>

            <!-- Notifications -->
            <a routerLink="/notification" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center gap-4 px-4 py-3.5 rounded-2xl bg-zinc-100 dark:bg-white/5 border border-zinc-200 dark:border-white/10 text-zinc-900 dark:text-white w-fit lg:w-full group shadow-lg backdrop-blur-md">

                <div class="flex items-center gap-4">

                    <svg class="w-6 h-6 text-zinc-600 dark:text-zinc-400 group-hover:text-violet-500 dark:group-hover:text-violet-400 transition-colors"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />

                    </svg>

                    <span class="hidden lg:block text-[16px] font-medium">
                        Notifications
                    </span>

                </div>

                <span
                    class="hidden lg:flex items-center justify-center w-5 h-5 bg-pink-500 text-white text-[11px] font-bold rounded-full">

                    {{ unreadNotificationsCount() }}

                </span>

            </a>


            <!-- Messages -->
            <a routerLink="/Messages" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center gap-4 px-4 py-3.5 rounded-2xl bg-zinc-100 dark:bg-white/5 border border-zinc-200 dark:border-white/10 text-zinc-900 dark:text-white w-fit lg:w-full group shadow-lg backdrop-blur-md">

                <div class="flex items-center gap-4">

                    <svg class="w-6 h-6 text-zinc-600 dark:text-zinc-400 group-hover:text-violet-500 dark:group-hover:text-violet-400 transition-colors"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />

                    </svg>

                    <span class="hidden lg:block text-[16px] font-medium">
                        Messages
                    </span>

                </div>

                <span class="hidden lg:block w-2.5 h-2.5 bg-violet-500 rounded-full animate-pulse">
                </span>

            </a>


            <!-- Bookmarks -->
            <a routerLink="/bookmarks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                class="flex items-center gap-4 px-4 py-3.5 rounded-2xl bg-zinc-100 dark:bg-white/5 border border-zinc-200 dark:border-white/10 text-zinc-900 dark:text-white w-fit lg:w-full group shadow-lg backdrop-blur-md">

                <svg class="w-6 h-6 text-zinc-600 dark:text-zinc-400 group-hover:text-violet-500 dark:group-hover:text-violet-400 transition-colors"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />

                </svg>

                <span class="hidden lg:block text-[16px] font-medium">
                    Bookmarks
                </span>

            </a>

        </nav>




        <!-- Create Post -->
        <button
            class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-2xl transition-all shadow-lg shadow-indigo-600/25 hidden lg:block">

            Create Post

        </button>

    </div>


    <!-- Settings -->
    <a routerLink="/setting" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">

        <button
            class="flex items-center gap-3 px-4 py-3 rounded-2xl text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-white/5 transition">

            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31.826-2.37 2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-2.924 0-3.35a1.724 1.724 0 000 3.35a1.724 1.724 0 001.066 2.573c-.94 1.543.826 3.31 2.37 2.37.996.608 2.296.07 2.572-1.065z" />

            </svg>

            <span class="hidden lg:block font-medium">
                Settings
            </span>

        </button>

    </a>

</header>
